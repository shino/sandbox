name: DB Guard Override Test (redhat db, relaxed via overrides)

# Sibling of db-guard-fail-test-redhat-db.yml — same pinned BASELINE/TARGET
# digests (2026-03-03 → 2026-03-04 nightly-db; redhat:6 65.1%, redhat:7
# 56.5% db change rate), but with `db_change_rate_threshold_overrides`
# set high enough on redhat:6 and redhat:7 that the `vuls diff db` step
# PASSES instead of failing. Verifies the override path end-to-end against
# the very scenario that was previously a hard FAIL.
#
# Expected aggregate: rc=(0,0,0), job PASSES. Step summary should show
# `*` markers next to redhat:6 / redhat:7 entries (vuls2 emits this when
# an override was applied) plus the override footnote.
#
# workflow_dispatch only — additive validation; no schedule.

on:
  workflow_dispatch:
    inputs:
      db_change_rate_threshold:
        description: "`vuls diff db` default change rate (%) threshold per ecosystem; redhat:6/7 are relaxed via _overrides below."
        required: false
        default: "10"
      db_change_rate_threshold_overrides:
        description: |
          Per-ecosystem overrides of `vuls diff db` threshold. Default
          relaxes the two failing redhat ecosystems for the pinned
          2026-03-03→04 scenario.
        required: false
        type: string
        default: |
          redhat:6=100
          redhat:7=100
      detection_change_rate_threshold:
        description: "`vuls diff detection` change rate (%) threshold per scan result. Default 10000 (detection is irrelevant in this scenario; baseline is detection-stable)."
        required: false
        default: "10000"
      detection_change_rate_threshold_overrides:
        description: "Per-file overrides of `vuls diff detection` threshold (unused in this scenario)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build vuls.db
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      # Historical vuls.db digests pinned to the redhat regression scenario
      # used by db-guard-fail-test-redhat-db.yml — kept identical so the
      # only difference between the two workflows is the override input.
      BASELINE_REPOSITORY: ghcr.io/vulsio/vuls-nightly-db@sha256:692d444eab1b00df28e82b2c9bd79ead31761586d0f6dabc71aab591a848dbd5
      TARGET_REPOSITORY: ghcr.io/vulsio/vuls-nightly-db@sha256:1b87a7a198d9c765a35df803b2d5b61d1c5e2aad4e7c23b2427a44b25f69e0f2
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Check out repository (for composite action)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go 1.x
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "stable"
          cache: false

      # Pinned to the head of MaineK00n/vuls2 PR #371 (which ships the
      # `--change-rate-threshold-override` CLI flag this test depends on).
      # Once #371 merges and a vuls2 nightly with the flag is published,
      # revert to `@nightly`.
      - name: Install vuls2
        run: go install github.com/MaineK00n/vuls2/cmd/vuls@c5865c6b6e3ae6ffe3ef1e2d74ec83e90fafd13c

      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      - name: Fetch target vuls.db (hand-picked historical DB)
        run: vuls db fetch --dbpath ./vuls.db --repository "$TARGET_REPOSITORY" --no-progress

      - name: Compress vuls.db (zstd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          zstd -f -T0 ./vuls.db -o ./vuls.db.zst
          ls -lh ./vuls.db ./vuls.db.zst

      - name: Push vuls.db to GHCR (tagless, digest-only)
        id: push
        run: |
          set -euo pipefail
          digest=$(vuls db push --token "${{ secrets.GITHUB_TOKEN }}" ghcr.io/shino/package-push-test1 ./vuls.db.zst)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Pushed candidate image (untagged, digest-only)"
            echo '```text'
            echo "digest ref : ghcr.io/shino/package-push-test1@${digest}"
            echo '```'
            echo "Image is always pushed before the diff guard runs; a failing"
            echo "build stays pullable by digest for investigation."
          } >> "$GITHUB_STEP_SUMMARY"

      # Same scenario as db-guard-fail-test-redhat-db.yml (redhat:6/7 db
      # change rates ~65/57%) but with redhat:6/7 overridden to 100 → the
      # `vuls diff db` step is expected to PASS now, demonstrating the
      # override path. integration_ref / vuls0_old_ref kept identical.
      - name: Run diff guard
        uses: ./.github/actions/diff-guard
        with:
          target_db: ./vuls.db
          baseline_repository: ${{ env.BASELINE_REPOSITORY }}
          db_change_rate_threshold: ${{ github.event.inputs.db_change_rate_threshold || '10' }}
          db_change_rate_threshold_overrides: ${{ github.event.inputs.db_change_rate_threshold_overrides || '' }}
          detection_change_rate_threshold: ${{ github.event.inputs.detection_change_rate_threshold || '10000' }}
          detection_change_rate_threshold_overrides: ${{ github.event.inputs.detection_change_rate_threshold_overrides || '' }}
          vuls0_old_ref: 9efad2a
          integration_ref: 24c96d27ea0ead49ad8311d8c92d204fef5c58b4

      # Guard expected to PASS in this scenario thanks to the overrides.
      - name: Promote digest to :nightly
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          vuls-data-update dotgit registry tag \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            "ghcr.io/shino/package-push-test1@${DIGEST}" nightly
          {
            echo "## Promoted to :nightly"
            echo '```text'
            echo "ref        : ghcr.io/shino/package-push-test1:nightly"
            echo "digest ref : ghcr.io/shino/package-push-test1@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
