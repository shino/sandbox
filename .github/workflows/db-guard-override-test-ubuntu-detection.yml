name: DB Guard Override Test (ubuntu detection, relaxed via overrides)

# Sibling of db-guard-fail-test-ubuntu-detection.yml — same pinned
# BASELINE/TARGET digests (2026-03-10 → 2026-03-11 nightly-db) with the
# ubuntu-wide churn. In the fail-test that churn makes the older-binary
# `vuls diff detection` step FAIL; here `detection_change_rate_threshold_overrides`
# relaxes each ubuntu scan-result file enough that the step PASSES
# instead. (The master-HEAD detection step passes on its own — current
# master vuls0 normalizes this ubuntu detection to <1% drift — so it
# does not exercise the override but its rc=0 is needed for the
# aggregate.) Verifies the detection override path end-to-end.
#
# Expected aggregate: rc=(0,0,0), job PASSES. Each diff report's summary
# table carries a per-row Threshold column; overridden ubuntu_<release>
# rows show their relaxed threshold value there.
#
# Unrecognized override keys are tolerated — vuls2 silently ignores an
# override key that matches no scan-result file (the file just keeps the
# default threshold) — so the generous env list below stays valid even
# when integration_ref's fixture set is missing some ubuntu releases.
#
# The persistent overrides live in the build job's env (mirroring
# db-nightly.yml). Dispatching with the _overrides input left blank
# exercises the same `|| env.X` fallback a non-dispatch (schedule)
# event takes, so a plain workflow_dispatch verifies the scheduled-run
# path without waiting on cron.

on:
  workflow_dispatch:
    inputs:
      db_change_rate_threshold:
        description: "`vuls diff db` change rate (%) threshold per ecosystem. Default 10000 here so `diff db` PASSES (this scenario isolates detection-side override behavior)."
        required: false
        default: "10000"
      db_change_rate_threshold_overrides:
        description: "Per-ecosystem overrides of `vuls diff db` threshold (unused in this scenario)."
        required: false
        type: string
        default: ""
      detection_change_rate_threshold:
        description: "`vuls diff detection` default change rate (%) threshold per scan result; ubuntu_* files are relaxed via _overrides below."
        required: false
        default: "5"
      detection_change_rate_threshold_overrides:
        description: |
          Per-scan-result-file overrides of `vuls diff detection`
          threshold, as multi-line "<file-basename>=<rate>" entries.
          Leave empty to use the persistent list in the build job's
          DETECTION_CHANGE_RATE_THRESHOLD_OVERRIDES env; a non-empty
          value here replaces it for this dispatch only.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build vuls.db
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      # Historical vuls.db digests pinned to the ubuntu regression scenario
      # used by db-guard-fail-test-ubuntu-detection.yml — kept identical
      # so the only difference between the two workflows is the override
      # input.
      BASELINE_REPOSITORY: ghcr.io/vulsio/vuls-nightly-db@sha256:eab4b15e4db3700fa233bd5bc1e4dec87f3c0a71ad840f077897d527e4623f39
      TARGET_REPOSITORY: ghcr.io/vulsio/vuls-nightly-db@sha256:432808a4dfbea5d7b5be411f60d4af9d23c68a414235349eecfa92009d3d5f1a
      # Persistent detection-threshold overrides — single source of truth,
      # applied to scheduled and manually-dispatched runs alike (mirrors
      # db-nightly.yml). workflow_dispatch input defaults are NOT visible
      # to non-dispatch events, so the `Run diff guard` step falls back to
      # this env value. vuls0 emits basenames in 4-digit no-dot form
      # (`ubuntu_2204`, NOT `ubuntu_22.04`), so the keys match that shape;
      # the pinned `integration_ref` fixture set only carries ubuntu
      # 14.04–22.04. `1000` relaxes each file far past the 100–858% drift
      # the older pinned vuls0 produces, so the detection step PASSES.
      DETECTION_CHANGE_RATE_THRESHOLD_OVERRIDES: |
        ubuntu_1404=1000
        ubuntu_1604=1000
        ubuntu_1804=1000
        ubuntu_2004=1000
        ubuntu_2204=1000
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      - name: Check out repository (for composite action)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go 1.x
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install vuls2
        run: go install github.com/MaineK00n/vuls2/cmd/vuls@nightly

      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      - name: Fetch target vuls.db (hand-picked historical DB)
        run: vuls db fetch --dbpath ./vuls.db --repository "$TARGET_REPOSITORY" --no-progress

      - name: Compress vuls.db (zstd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          zstd -f -T0 ./vuls.db -o ./vuls.db.zst
          ls -lh ./vuls.db ./vuls.db.zst

      - name: Push vuls.db to GHCR (tagless, digest-only)
        id: push
        run: |
          set -euo pipefail
          digest=$(vuls db push --token "${{ secrets.GITHUB_TOKEN }}" ghcr.io/shino/package-push-test1 ./vuls.db.zst)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Pushed candidate image (untagged, digest-only)"
            echo '```text'
            echo "digest ref : ghcr.io/shino/package-push-test1@${digest}"
            echo '```'
            echo "Image is always pushed before the diff guard runs; a failing"
            echo "build stays pullable by digest for investigation."
          } >> "$GITHUB_STEP_SUMMARY"

      # Same scenario and pinned binaries as
      # db-guard-fail-test-ubuntu-detection.yml (9efad2a older vuls0
      # produces 100-858% drift across ubuntu_1404..ubuntu_2204 on the
      # 2026-03-10→11 DBs), but with `detection_change_rate_threshold_overrides`
      # set high enough on each ubuntu basename that the
      # `Diff detection (older pinned vuls0 @9efad2a)` step PASSES
      # instead of failing. The master HEAD step naturally passes
      # because newer vuls0 normalizes ubuntu detection to <1% drift
      # on these DBs — it does not exercise the override but its rc=0
      # is required for the aggregate.
      - name: Run diff guard
        uses: ./.github/actions/diff-guard
        with:
          target_db: ./vuls.db
          baseline_repository: ${{ env.BASELINE_REPOSITORY }}
          db_change_rate_threshold: ${{ github.event.inputs.db_change_rate_threshold || '10000' }}
          db_change_rate_threshold_overrides: ${{ github.event.inputs.db_change_rate_threshold_overrides || '' }}
          detection_change_rate_threshold: ${{ github.event.inputs.detection_change_rate_threshold || '5' }}
          detection_change_rate_threshold_overrides: ${{ github.event.inputs.detection_change_rate_threshold_overrides || env.DETECTION_CHANGE_RATE_THRESHOLD_OVERRIDES }}
          vuls0_old_ref: 9efad2a
          integration_ref: 24c96d27ea0ead49ad8311d8c92d204fef5c58b4

      # Guard expected to PASS in this scenario thanks to the overrides.
      - name: Promote digest to :nightly
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          vuls-data-update dotgit registry tag \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            "ghcr.io/shino/package-push-test1@${DIGEST}" nightly
          {
            echo "## Promoted to :nightly"
            echo '```text'
            echo "ref        : ghcr.io/shino/package-push-test1:nightly"
            echo "digest ref : ghcr.io/shino/package-push-test1@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
