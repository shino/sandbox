name: DB Guard Fail Test (simulated redhat diff-db failure)

# Sibling of db-guard-fail-test-ubuntu-detection.yml. This one pins two
# historical DB digests from ghcr.io/vulsio/vuls-nightly-db that exhibit
# a huge one-day redhat regression between 2026-03-03 and 2026-03-04:
# redhat:6 Detection Change Rate 65.1%, redhat:7 56.5%, redhat:5 8.7%,
# redhat:4 2.5%. KB change rate is 0.0% for all ecosystems (pure
# detection-side churn in the extracted data).
#
# This is configured as a **partial-failure** scenario:
#   - `vuls diff db` FAILS (~65% redhat:6, ~57% redhat:7)
#   - both `vuls diff detection` steps PASS (10000% detection threshold)
# Expected aggregate: rc=(0,0,1), job FAILs, step summary keeps the two
# passing detection reports plus the failing diff-db report side-by-side
# — verifying the deferred-exit aggregation surfaces full triage
# information rather than aborting at the first failure.
#
# The baseline/target digests are hardcoded as env vars (BASELINE_REPOSITORY /
# TARGET_REPOSITORY) below.

on:
  workflow_dispatch:
    inputs:
      db_change_rate_threshold:
        description: "`vuls diff db` change rate (%) threshold per ecosystem; diff fails if exceeded. Default 10 — redhat:6/7 change rates are ~65%/57% so any reasonable threshold will trip."
        required: false
        default: "10"
      detection_change_rate_threshold:
        description: "`vuls diff detection` change rate (%) threshold per scan result; diff fails if exceeded. Default 10000 here so detection PASSES — this scenario is intentionally configured as a partial failure (only `vuls diff db` trips) to verify that the deferred-exit aggregation still surfaces the passing detection reports."
        required: false
        default: "10000"

permissions:
  contents: read

jobs:
  build:
    name: build vuls.db
    permissions:
      contents: read
      # packages:write required for pushing to GHCR and moving the :nightly tag.
      packages: write
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
      # Historical vuls.db digests pinned to simulate a redhat regression.
      # Obtained via `vuls db search metadata --dbpath <daily>.db | jq -r .digest`.
      # Baseline: 2026-03-03 nightly-db. Target: 2026-03-04 nightly-db
      # (redhat:6 Detection Change Rate 65.1%, redhat:7 56.5%, redhat:5 8.7%,
      # redhat:4 2.5%; KB change rate 0.0% — pure detection-side churn).
      BASELINE_REPOSITORY: ghcr.io/vulsio/vuls-nightly-db@sha256:692d444eab1b00df28e82b2c9bd79ead31761586d0f6dabc71aab591a848dbd5
      TARGET_REPOSITORY: ghcr.io/vulsio/vuls-nightly-db@sha256:1b87a7a198d9c765a35df803b2d5b61d1c5e2aad4e7c23b2427a44b25f69e0f2
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-large-packages: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"

      # Check out this repo first so the composite action at
      # `.github/actions/diff-guard` is resolvable via `uses: ./...`.
      # NOTE: must precede any step that writes files to the workspace —
      # `actions/checkout` cleans the workspace by default and would wipe
      # the freshly fetched ./vuls.db otherwise.
      - name: Check out repository (for composite action)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go 1.x
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "stable"
          cache: false

      - name: Install vuls2
        run: go install github.com/MaineK00n/vuls2/cmd/vuls@nightly

      # vuls-data-update is used to move the :nightly tag (registry tag)
      # once the guard passes.
      - name: Install vuls-data-update
        run: go install github.com/MaineK00n/vuls-data-update/cmd/vuls-data-update@main

      # Stand-in for the freshly built ./vuls.db — fetch the hand-picked target
      # DB (expected to contain the simulated redhat regression).
      - name: Fetch target vuls.db (hand-picked historical DB)
        run: vuls db fetch --dbpath ./vuls.db --repository "$TARGET_REPOSITORY" --no-progress

      # `vuls db push` only accepts Zstandard-compressed payloads.
      - name: Compress vuls.db (zstd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          zstd -f -T0 ./vuls.db -o ./vuls.db.zst
          ls -lh ./vuls.db ./vuls.db.zst

      # Design: "always push tagless, operate by digest, promote to :nightly only on pass".
      # See db-guard-test.yml for the rationale. In this fail-test workflow
      # the guard is EXPECTED to fail, so the promotion step below is
      # expected to be skipped — leaving :nightly untouched while the
      # candidate manifest remains pullable by digest for investigation.
      - name: Push vuls.db to GHCR (tagless, digest-only)
        id: push
        run: |
          set -euo pipefail
          digest=$(vuls db push --token "${{ secrets.GITHUB_TOKEN }}" ghcr.io/shino/package-push-test1 ./vuls.db.zst)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "## Pushed candidate image (untagged, digest-only)"
            echo '```text'
            echo "digest ref : ghcr.io/shino/package-push-test1@${digest}"
            echo '```'
            echo "Image is always pushed before the diff guard runs; a failing"
            echo "build stays pullable by digest for investigation."
          } >> "$GITHUB_STEP_SUMMARY"

      # Partial-failure scenario: only `vuls diff db` trips (~65% redhat:6,
      # ~57% redhat:7); both `vuls diff detection` steps PASS thanks to a
      # 10000% detection threshold default. This exercises the
      # deferred-exit aggregation: rc=(0,0,1) → job FAILs but the step
      # summary keeps the two passing detection reports for triage.
      #
      # `integration_ref` is pinned to the older fixture commit
      # 24c96d27ea0ead49ad8311d8c92d204fef5c58b4 because the pinned
      # BASELINE/TARGET DBs (2026-03-03/04) predate OS families
      # (ubuntu:26.04, debian:11) present in the current default fixture
      # set; using the older fixtures lets `vuls diff detection` actually
      # produce real reports against these historical DBs instead of
      # crashing with `"<family>" not found`.
      - name: Run diff guard
        uses: ./.github/actions/diff-guard
        with:
          target_db: ./vuls.db
          baseline_repository: ${{ env.BASELINE_REPOSITORY }}
          db_change_rate_threshold: ${{ github.event.inputs.db_change_rate_threshold || '10' }}
          detection_change_rate_threshold: ${{ github.event.inputs.detection_change_rate_threshold || '10000' }}
          vuls0_old_ref: 9efad2a
          integration_ref: 24c96d27ea0ead49ad8311d8c92d204fef5c58b4

      # Guard passed: attach :nightly to the verified digest. In this
      # fail-test the guard is expected to fail, so
      # this step will normally be skipped and :nightly will remain untouched.
      - name: Promote digest to :nightly
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          vuls-data-update dotgit registry tag \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            "ghcr.io/shino/package-push-test1@${DIGEST}" nightly
          {
            echo "## Promoted to :nightly"
            echo '```text'
            echo "ref        : ghcr.io/shino/package-push-test1:nightly"
            echo "digest ref : ghcr.io/shino/package-push-test1@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
